<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套餐选择</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f6f6f6;
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.sub{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:16px;
    border-radius:14px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#e91e63;
}

.desc{
    font-size:13px;
    color:#666;
    margin-top:8px;
    line-height:1.5;
}

.btn{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.tag{
    display:inline-block;
    padding:4px 8px;
    background:#eee;
    border-radius:6px;
    font-size:12px;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>套餐中心</h1>
<div class="sub">简单 · 快速 · 即开即用</div>

<!-- 套餐1 -->
<div class="card">
    <div class="price">128 元 - 初级套餐</div>
    <div class="tag">入门推荐</div>
    <div class="desc">
        基础内容访问<br>
        标准体验服务<br>
        单设备使用
    </div>
    <button class="btn" onclick="buy('128')">立即购买</button>
</div>

<!-- 套餐2 -->
<div class="card">
    <div class="price">288 元 - 中级套餐</div>
    <div class="tag">热门选择</div>
    <div class="desc">
        进阶内容权限<br>
        多设备支持<br>
        更快体验服务
    </div>
    <button class="btn" onclick="buy('288')">立即购买</button>
</div>

<!-- 套餐3 -->
<div class="card">
    <div class="price">399 元 - 高级套餐</div>
    <div class="tag">VIP推荐</div>
    <div class="desc">
        全部内容权限<br>
        VIP专属服务<br>
        优先体验通道
    </div>
    <button class="btn" onclick="buy('399')">立即购买</button>
</div>

</div>

<script>
function buy(price){
    // 把价格传到支付页
    window.location.href = "pay.html?price=" + price;
}
</script>

</body>
</html>
