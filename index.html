<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员套餐</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f6f6f6;
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

h1{text-align:center;}
.sub{text-align:center;color:#666;margin-bottom:20px;}

.card{
    background:#fff;
    padding:16px;
    border-radius:14px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#e91e63;
}

.tag{
    display:inline-block;
    padding:4px 8px;
    background:#eee;
    border-radius:6px;
    font-size:12px;
    margin-top:5px;
}

.btn{
    width:100%;
    padding:14px;
    font-size:18px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:12px;
    margin-top:20px;
}

.desc{
    font-size:13px;
    color:#666;
    margin-top:6px;
    line-height:1.4;
}
</style>
</head>

<body>

<div class="container">

<h1>会员套餐中心</h1>
<div class="sub">稳定 · 私密 · 高质量内容体验</div>

<div class="card">
    <div class="price">128 USDT - 基础会员</div>
    <div class="tag">入门推荐</div>
    <div class="desc">
        学生风格内容<br>
        日常互动主题<br>
        基础内容访问权限
    </div>
</div>

<div class="card">
    <div class="price">288 USDT - 高级会员</div>
    <div class="tag">热门选择</div>
    <div class="desc">
        进阶内容库<br>
        直播互动体验<br>
        高清内容 + 户外主题内容
    </div>
</div>

<div class="card">
    <div class="price">399 USDT - VIP会员</div>
    <div class="tag">尊享推荐</div>
    <div class="desc">
        VIP专属内容合集<br>
        优先更新权限<br>
        高级互动体验
    </div>
</div>

<button class="btn" onclick="go()">立即进入支付</button>

</div>

<script>
function go(){
    window.location.href = "pay.html";
}
</script>

</body>
</html>
