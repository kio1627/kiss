<!DOCTYPE html><html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易支付商铺</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  background: #f5f5f5;
  color: #222;
}

.header {
  background: white;
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.banner {
  background: linear-gradient(135deg,#46a3ff,#7cf3ff);
  padding: 40px 20px;
  text-align: center;
  color: white;
  font-size: 32px;
  font-weight: bold;
}

.container {
  padding: 15px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}

.title {
  font-size: 22px;
  margin-bottom: 15px;
  font-weight: bold;
}

.info {
  margin-bottom: 10px;
  line-height: 1.8;
}

select,
input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.price-box {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}

.btn {
  width: 100%;
  padding: 15px;
  background: #2f80ff;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  margin-top: 18px;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.9;
}

.notice {
  color: #ff3b30;
  line-height: 1.7;
}

  </style>
</head>
<body>  <div class="header" style="position:relative;">
  易支付商铺
  <a href="#" style="position:absolute;right:15px;top:18px;font-size:14px;background:#2f80ff;color:white;padding:8px 12px;border-radius:10px;text-decoration:none;">
    订单查询
  </a>
</div>  <div class="banner">
    你想买的账号<br />我们都有！
  </div>  <div class="container"><div class="card">
  <div class="title">商户信息</div>
  <div class="info">商户名称：易支付商铺</div>
  <div class="info">
    Telegram客服：
    <a href="https://t.me/yourbot" target="_blank">
      点击联系
    </a>
  </div>
</div>



<div class="card">
  <div class="title">选择商品</div>

  <select id="product"></select>

<div id="stock" style="margin-top:12px;font-size:16px;color:#666;">
库存：155
</div><input type="number" id="qty" value="1" min="1"><div class="price">
总价格：<span id="total">58</span> USDT
</div><button class="btn" onclick="goPay()">
立即支付
</button></div>
</div><script>

const data = {
  "微信业务": [
    {name:"微信满月实名号带支付",price:58,stock:155},
    {name:"微信半年号实名带支付",price:80,stock:55},
    {name:"微信一年号实名带支付",price:100,stock:27},
    {name:"微信年号实名",price:42,stock:33}
  ],

  "支付宝业务": [
    {name:"支付宝V2直登号",price:68,stock:44},
    {name:"支付宝V3直登号",price:88,stock:22}
  ],

  "抖音业务": [
    {name:"抖音实名号",price:36,stock:61},
    {name:"抖音直播号",price:52,stock:28},
    {name:"抖音万粉账号",price:100,stock:13}
  ],

  "QQ业务": [
    {name:"QQ五位号",price:66,stock:24},
    {name:"QQ老号",price:35,stock:77},
    {name:"QQ靓号",price:88,stock:15}
  ],

  "微博业务": [
    {name:"微博实名号",price:22,stock:43},
    {name:"微博老号",price:39,stock:18}
  ]
};

const category = document.getElementById("category");
const product = document.getElementById("product");
const qty = document.getElementById("qty");
const total = document.getElementById("total");
const stock = document.getElementById("stock");

function changeProducts(){
  let list = data[category.value];

  product.innerHTML = "";

  list.forEach(item => {
    let option = document.createElement("option");
    option.value = item.price;
    option.text = `${item.name} - ${item.price} USDT`;
    option.dataset.stock = item.stock;
    product.appendChild(option);
  });

  updatePrice();
}

function updatePrice(){
  let price = Number(product.value);
  let quantity = Number(qty.value);

  total.innerText = price * quantity;

  let current = product.options[product.selectedIndex];
  stock.innerText = "库存：" + current.dataset.stock;
}

product.addEventListener("change", updatePrice);
qty.addEventListener("input", updatePrice);

function goPay(){
  let amount = total.innerText;
  window.location.href = "pay.html?price=" + amount;
}

changeProducts();

</script></body>
</html>
