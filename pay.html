<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安全支付中心</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:
linear-gradient(180deg,#eef2ff,#f8fafc);

min-height:100vh;
}

.header{

background:
linear-gradient(135deg,#4f46e5,#2563eb);

color:white;

text-align:center;

padding:24px;

font-size:26px;

font-weight:bold;

box-shadow:
0 5px 20px rgba(0,0,0,0.12);
}

.box{

max-width:550px;

margin:auto;

padding:20px;
}

.card{

background:
rgba(255,255,255,0.88);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.5);

border-radius:30px;

padding:30px;

margin-top:25px;

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,0.08);
}

.notice{

color:#ef4444;

font-size:28px;

font-weight:bold;

line-height:1.5;
}

.pay-label{

margin-top:22px;

color:#6b7280;

font-size:15px;
}

.price{

font-size:54px;

font-weight:bold;

margin-top:10px;

color:#111827;
}

.order{

margin-top:16px;

color:#6b7280;

font-size:16px;
}

.safe{

margin-top:18px;

color:#10b981;

font-size:15px;
}

.address{

margin-top:26px;

background:#f3f4f6;

padding:20px;

border-radius:20px;

word-break:break-all;

font-size:15px;

color:#111827;

line-height:1.8;
}

.btn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:
linear-gradient(135deg,#4f46e5,#2563eb);

color:white;

font-size:18px;

margin-top:24px;

cursor:pointer;

box-shadow:
0 8px 20px rgba(37,99,235,0.25);
}

.btn:active{

transform:scale(0.98);
}

.wallets{

margin-top:30px;
}

.wallet{

background:white;

padding:16px;

border-radius:18px;

margin-top:14px;

font-size:17px;

box-shadow:
0 5px 15px rgba(0,0,0,0.05);
}

.tip{

margin-top:26px;

color:#ef4444;

line-height:1.9;

font-size:15px;
}

</style>
</head>

<body>

<div class="header">
🛡️ 安全支付中心
</div>

<div class="box">

<div class="card">

<div class="notice">
请使用 USDT-TRC20 支付
</div>

<div class="pay-label">
当前支付金额
</div>

<div class="price">

<span id="money">
0
</span>

USDT

</div>

<div class="order">

订单号：
<span id="order">
000000
</span>

</div>

<div class="safe">
✔ 区块链安全支付通道
</div>

<div class="address" id="wallet">
TPvLqenUdNwJKpyNsbH7hKAiJxkcNaNcvi
</div>

<button class="btn" onclick="copyAddress()">
复制钱包地址
</button>

<div class="wallets">

<div class="wallet">
📱 imToken
</div>

<div class="wallet">
👛 TokenPocket
</div>

<div class="wallet">
⚡ TronLink
</div>

</div>

<div class="tip">
请勿支付非TRC20资产。
</div>

</div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const price =
params.get("price");

const order =
params.get("order");

document.getElementById("money").innerText =
price;

document.getElementById("order").innerText =
order;

function copyAddress(){

let text =
document.getElementById("wallet").innerText;

let input =
document.createElement("input");

input.value = text;

document.body.appendChild(input);

input.select();

document.execCommand("copy");

document.body.removeChild(input);

alert("钱包地址已复制");

}

</script>

</body>
</html>
