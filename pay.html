<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付页面</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:20px;
}

.box{
    max-width:420px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:14px;
}

h2{text-align:center;}

select,input,button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    font-size:16px;
}

.step{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f7f7f7;
}

.addr{
    background:#eee;
    padding:10px;
    border-radius:8px;
    word-break:break-all;
}

.red{color:red;font-size:13px;}
.green{color:green;}
</style>
</head>

<body>

<div class="box">

<h2>订单支付</h2>

<!-- STEP 1 -->
<label>选择套餐</label>
<select id="plan">
  <option value="18">初级套餐（18 USDT）</option>
  <option value="40">中级套餐（40 USDT）</option>
  <option value="55">高级套餐（55 USDT）</option>
</select>

<label>联系方式</label>
<input type="text" id="contact" placeholder="微信 / Telegram">

<button onclick="nextStep()">下一步：生成支付信息</button>

<!-- STEP 2 -->
<div id="pay" class="step" style="display:none;">

    <h3 class="green">支付方式：USDT-TRC20</h3>

    <p class="red">
        ⚠️ 仅支持 TRC20（波场链）<br>
        转错链不到账
    </p>

    <p>应付金额：<span id="money"></span> USDT</p>

    <div class="addr" id="addr">
        TPvLqenUdNwJKpyNsbH7hKAiJxkcNaNcvi
    </div>

    <button onclick="copyAddr()">复制地址</button>

    <input type="text" id="txid" placeholder="填写TxID">

    <button onclick="submitOrder()">提交订单</button>

</div>

</div>

<script>
let plan = document.getElementById("plan");

function nextStep(){
    let contact = document.getElementById("contact").value;

    if(!contact){
        alert("请先填写联系方式");
        return;
    }

    document.getElementById("pay").style.display = "block";
    document.getElementById("money").innerText = plan.value;

    // 自动滚动到支付区（关键！）
    document.getElementById("pay").scrollIntoView({behavior:"smooth"});
}

function copyAddr(){
    navigator.clipboard.writeText(document.getElementById("addr").innerText);
    alert("已复制地址");
}

function submitOrder(){
    let contact = document.getElementById("contact").value;
    let txid = document.getElementById("txid").value;
    let planText = plan.options[plan.selectedIndex].text;

    if(!txid){
        alert("请填写TxID");
        return;
    }

    let msg =
`新订单：
套餐：${planText}
联系方式：${contact}
TxID：${txid}`;

    window.open("https://t.me/你的用户名?text=" + encodeURIComponent(msg));
}
</script>

</body>
</html>
