<!-- pay.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT支付</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(180deg,#eef2ff,#f8fafc);
}

.header{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    text-align:center;
    padding:22px;
    font-size:24px;
    font-weight:bold;
}

.box{
    max-width:550px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:24px;
    padding:28px;
    margin-top:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.price{
    font-size:44px;
    font-weight:bold;
    margin-top:20px;
}

.order{
    margin-top:16px;
    color:#666;
    font-size:16px;
}

.address{
    margin-top:25px;
    background:#f3f4f6;
    padding:18px;
    border-radius:14px;
    word-break:break-all;
    font-size:15px;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    font-size:18px;
    margin-top:20px;
}

.wallets{
    margin-top:28px;
}

.wallet{
    background:#f8fafc;
    padding:15px;
    border-radius:14px;
    margin-top:12px;
    font-size:17px;
}

.tip{
    margin-top:24px;
    color:#ff3b30;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="header">
USDT TRC20 支付
</div>

<div class="box">

<div class="card">

<h2>等待支付</h2>

<div class="price">
<span id="money"></span>
USDT
</div>

<div class="order">
订单号：
<span id="order"></span>
</div>

<div class="address" id="wallet">
TPvLqenUdNwJKpyNsbH7hKAiJxkcNaNcvi
</div>

<button class="btn" onclick="copyAddress()">
复制钱包地址
</button>

<div class="wallets">

<div class="wallet">
imToken
</div>

<div class="wallet">
TokenPocket
</div>

<div class="wallet">
TronLink
</div>

</div>

<div class="tip">
支付完成后请联系TG客服处理订单。
</div>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const price = params.get("price");

const order = params.get("order");

document.getElementById("money").innerText =
price;

document.getElementById("order").innerText =
order;

function copyAddress(){

let text =
document.getElementById("wallet").innerText;

navigator.clipboard.writeText(text);

alert("钱包地址已复制");

}

</script>

</body>
</html>
